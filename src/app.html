<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0e7a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="听见">
  <title>听见 · 实时字幕</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <div id="app">
    <!-- 密码门 -->
    <div v-if="screen === 'gate'" class="gate">
      <h1 class="gate-title">听见</h1>
      <p class="gate-sub">实时语音字幕</p>
      <div class="gate-pw">
        <input v-model="gatePassword" :type="showPw ? 'text' : 'password'" autocomplete="current-password"
               placeholder="请输入密码" @keyup.enter="submitGate">
        <button type="button" class="gate-eye" @click="showPw = !showPw">{{ showPw ? '隐藏' : '显示' }}</button>
      </div>
      <label class="gate-remember"><input type="checkbox" v-model="rememberPassword"> 记住密码</label>
      <p v-if="gateError" class="gate-error">{{ gateError }}</p>
      <button class="btn-main" :disabled="gateBusy" @click="submitGate">{{ gateBusy ? '进入中…' : '进入' }}</button>
    </div>

    <!-- 历史列表 -->
    <div v-else-if="screen === 'history'" class="screen">
      <header class="app-header">
        <button class="icon-btn" aria-label="返回" @click="screen = 'main'">←</button>
        <div class="header-title"><h1 class="app-title">历史记录</h1></div>
        <div class="font-ctrl"></div>
      </header>
      <main class="history-list">
        <p v-if="!history.length" class="hint">还没有记录</p>
        <button v-for="s in history" :key="s.id" class="history-item" @click="openHistoryDetail(s.id)">
          <span class="history-meta">{{ fmtHistoryTime(s.startedAt) }} · {{ fmtHistoryDur(s) }}</span>
          <span class="history-preview">{{ historyPreview(s) }}</span>
        </button>
      </main>
      <footer class="controls">
        <button class="btn-sub" :disabled="!history.length" @click="clearHistory">清空全部</button>
      </footer>
    </div>

    <!-- 历史详情 -->
    <div v-else-if="screen === 'historyDetail'" class="screen">
      <header class="app-header">
        <button class="icon-btn" aria-label="返回" @click="screen = 'history'">←</button>
        <div class="header-title">
          <h1 class="app-title">记录详情</h1>
          <p class="app-sub">{{ historyDetail ? fmtHistoryTime(historyDetail.startedAt) : '' }}</p>
        </div>
        <div class="font-ctrl">
          <button class="icon-btn" :disabled="fontSize <= 0" aria-label="减小字号" @click="decFont">A-</button>
          <button class="icon-btn" :disabled="fontSize >= 9" aria-label="增大字号" @click="incFont">A+</button>
        </div>
      </header>
      <main class="transcript" :class="'font-' + fontSize">
        <template v-if="historyDetail">
          <p v-for="(line, i) in historyDetail.text.split('\n')" :key="i" class="final">{{ line }}</p>
        </template>
      </main>
      <footer class="controls">
        <div class="secondary-row">
          <button class="btn-sub" @click="screen = 'history'">返回</button>
          <button class="btn-sub" @click="copyText(historyDetail ? historyDetail.text : '', '已复制')">复制</button>
          <button class="btn-sub" @click="deleteHistory(historyDetail ? historyDetail.id : null)">删除</button>
        </div>
      </footer>
    </div>

    <!-- 主界面 -->
    <template v-else>
      <header class="app-header">
        <button class="icon-btn" data-menu-toggle aria-label="菜单" @click="menuOpen = !menuOpen">⚙</button>
        <div class="header-title">
          <h1 class="app-title">听见</h1>
          <p class="app-sub">{{ statusText }}</p>
        </div>
        <div class="font-ctrl" aria-label="字号调节">
          <button class="icon-btn" :disabled="fontSize <= 0" aria-label="减小字号" @click="decFont">A-</button>
          <button class="icon-btn" :disabled="fontSize >= 9" aria-label="增大字号" @click="incFont">A+</button>
        </div>
        <!-- ⚙ 菜单（收起面板） -->
        <nav v-if="menuOpen" class="menu">
          <button @click="copyAll">复制全文</button>
          <button @click="clearScreen">清空屏幕</button>
          <button @click="openHistory">历史记录</button>
          <button @click="toggleTheme">{{ isDark ? '切换为浅色' : '切换为深色' }}</button>
          <button @click="logout">退出密码</button>
        </nav>
      </header>

      <main class="transcript" :class="'font-' + fontSize" ref="transcriptEl" @scroll="onScroll">
        <p v-if="finalLines.length === 0 && !interimText" class="hint">点下方按钮开始听写</p>
        <template v-for="line in finalLines" :key="line.key">
          <p v-if="line.type === 'divider'" class="session-divider">{{ line.label }}</p>
          <p v-else class="final">{{ line.text }}</p>
        </template>
        <p v-if="interimText" class="interim">{{ interimText }}</p>
        <button v-if="!autoScroll && (finalLines.length || interimText)" class="jump-btn" @click="scrollToBottom">↓ 回到最新</button>
      </main>

      <footer class="controls">
        <button class="btn-main" :class="'btn-' + state"
                :disabled="state === 'stopping' || state === 'connecting'"
                @click="toggleListen">{{ mainButtonText }}</button>
        <div class="secondary-row">
          <button class="btn-sub" :disabled="!finalLines.length && !interimText" @click="clearScreen">清空</button>
          <button class="btn-sub" :disabled="!fullText" @click="copyAll">复制</button>
        </div>
      </footer>

      <div v-if="toastMsg" class="toast">{{ toastMsg }}</div>
    </template>
  </div>
  <script src="vendor/vue.global.prod.js"></script>
  <script id="listen-core">
  // ===== 协议层：纯函数，无 DOM/Vue 依赖（帧格式见 PLAN.md §2.2，可被 Node 提取单测） =====
  window.ListenProto = (function () {
    'use strict';
    function u32be(n) {
      const b = new Uint8Array(4);
      new DataView(b.buffer).setUint32(0, n);
      return b;
    }
    function concat(parts) {
      let n = 0;
      for (let i = 0; i < parts.length; i++) n += parts[i].length;
      const out = new Uint8Array(n);
      let off = 0;
      for (let i = 0; i < parts.length; i++) { out.set(parts[i], off); off += parts[i].length; }
      return out;
    }
    async function gzip(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    // 配置帧：11 10 11 00（gzip）或 11 10 10 00（raw，浏览器无 CompressionStream 时降级）
    async function buildConfigFrame(configObj) {
      const useGzip = typeof CompressionStream !== 'undefined';
      const json = new TextEncoder().encode(JSON.stringify(configObj));
      const payload = useGzip ? await gzip(json) : json;
      return concat([new Uint8Array([0x11, 0x10, useGzip ? 0x11 : 0x10, 0x00]), u32be(payload.length), payload]);
    }

    // 音频帧：11 20 00 00（raw PCM）；尾包 flags=0010 → 11 22 00 00
    function buildAudioFrame(pcm, isLast) {
      return concat([new Uint8Array([0x11, isLast ? 0x22 : 0x20, 0x00, 0x00]), u32be(pcm.length), pcm]);
    }

    // 解析服务端帧（同步部分；gzip 载荷由调用方经 gunzip 异步解）
    function parseFrame(buf) {
      const b = new Uint8Array(buf);
      if (b.length < 4) return { type: 'short' };
      const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
      const msgType = b[1] >> 4, flags = b[1] & 15, comp = b[2] & 15;
      let off = 4;
      if (msgType === 0b1111) { // 错误帧：4B code + 4B msglen + msg
        const code = dv.getUint32(off); off += 4;
        const n = dv.getUint32(off); off += 4;
        return { type: 'error', code: code, msg: new TextDecoder().decode(b.subarray(off, off + n)) };
      }
      let seq = null;
      if (flags & 1) { seq = dv.getInt32(off); off += 4; }
      const n = dv.getUint32(off); off += 4;
      return { type: 'resp', msgType: msgType, flags: flags, seq: seq, gzip: comp === 1, payload: b.subarray(off, off + n) };
    }

    async function gunzip(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    return { buildConfigFrame: buildConfigFrame, buildAudioFrame: buildAudioFrame, parseFrame: parseFrame, gunzip: gunzip };
  })();

  // ===== AudioWorklet 源码（Blob URL 内联；Float32 → 线性插值降采样 16k → Int16 → 200ms/块） =====
  // 注意：勿照抄 listen-old（ScriptProcessor/写死 44100 都是坑，PLAN.md §4.0）
  window.LISTEN_WORKLET_SRC = `
class ListenPcmProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.srcRate = sampleRate;                        // AudioWorkletGlobalScope 全局，按实际值算
    this.ratio = this.srcRate / 16000;                // 每个输出样本对应的输入样本数
    this.blockIn = Math.round(this.srcRate * 0.2);    // 200ms 的输入样本数
    this.buf = new Float32Array(this.blockIn * 2);
    this.len = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    if (this.len + ch.length > this.buf.length) {
      const bigger = new Float32Array((this.len + ch.length) * 2);
      bigger.set(this.buf.subarray(0, this.len));
      this.buf = bigger;
    }
    this.buf.set(ch, this.len);
    this.len += ch.length;
    while (this.len >= this.blockIn) {
      const pcm = new Int16Array(3200);               // 200ms @ 16k s16le
      for (let i = 0; i < 3200; i++) {
        const pos = i * this.ratio;
        const i0 = Math.floor(pos);
        const frac = pos - i0;
        const a = this.buf[i0];
        const b = i0 + 1 < this.len ? this.buf[i0 + 1] : a;
        let v = a + (b - a) * frac;
        v = v < -1 ? -1 : v > 1 ? 1 : v;
        pcm[i] = Math.round(v * 32767);
      }
      this.port.postMessage({ int16: pcm.buffer }, [pcm.buffer]);   // transferable
      const consumed = Math.round(3200 * this.ratio);
      this.buf.copyWithin(0, consumed, this.len);
      this.len -= consumed;
    }
    return true;
  }
}
registerProcessor('listen-pcm', ListenPcmProcessor);
`;
  </script>
  <script id="listen-app">
  (function () {
    'use strict';
    const { createApp } = Vue;

    // ===== 重资源放模块级，不进 data()（避免响应式代理性能坑，PLAN.md §4.2） =====
    let ws = null;             // 当前 WebSocket
    let audioCtx = null;       // AudioContext
    let workletNode = null;    // AudioWorkletNode
    let srcNode = null;        // MediaStreamAudioSourceNode
    let micStream = null;      // MediaStream（重连时不关，只重建 WS）
    let committedKeys = null;  // Set：definite 去重（与 finalLines 同生命周期；重连换新会话要重置）
    let listenStartAt = 0;     // 计时起点
    let tickTimer = null;
    let reconnectAttempts = 0;
    let userStopped = false;
    let stopTimer = null;
    let toastTimer = null;
    let wakeLock = null;      // ScreenWakeLock（listening 时常亮，PLAN.md §4.4 核心需求）
    let sessionId = null;     // 当前会话 id（历史落库用）
    let draftTimer = null;    // 草稿 30s 落盘
    let historyTimer = null;  // listening 期间 60s 历史落库

    const SILENCE_100MS = new Uint8Array(3200); // 100ms 静音（16k s16le），尾包兜底用

    const CONFIG = {
      user: { uid: 'listen-web' },
      audio: { format: 'pcm', rate: 16000, bits: 16, channel: 1 },
      request: {
        model_name: 'bigmodel', enable_punc: true, enable_itn: true,
        enable_ddc: false, show_utterances: true, result_type: 'single'
      }
    };
    const RECONNECT_DELAYS = [1000, 2000, 4000, 8000, 16000]; // 指数退避，最多 5 次

    function fmtClock(d) {
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      return h + ':' + m;
    }

    const app = createApp({
      data() {
        return {
          screen: 'main',        // 'gate' | 'main'
          state: 'idle',         // idle/connecting/listening/stopping/error（PLAN.md §4.1）
          fontSize: 5,           // vh 十档，默认第 5 档 8.2vh（沿用旧版）
          finalLines: [],        // 定稿行 [{key, text}] 或会话分隔 [{key, type:'divider', label}]
          interimText: '',       // 进行中草稿
          elapsedSec: 0,
          errorMsg: '',
          autoScroll: true,      // 用户上滑看历史时暂停自动滚动
          menuOpen: false,
          toastMsg: '',
          isDark: false,
          showPw: false,
          gatePassword: '',
          gateError: '',
          gateBusy: false,
          rememberPassword: true,
          history: [],           // 历史列表（进面板时加载）
          historyDetail: null,   // 当前查看的历史条目
          draftRestored: false,  // 本次打开恢复了上次草稿（点开始时归档进历史）
          draftSavedAt: 0
        };
      },
      computed: {
        statusText() {
          if (this.state === 'listening') return '正在听写';
          if (this.state === 'connecting') return '连接中…';
          if (this.state === 'stopping') return '正在结束…';
          if (this.state === 'error') return this.errorMsg || '出错了';
          return '准备就绪';
        },
        mainButtonText() {
          const mm = String(Math.floor(this.elapsedSec / 60)).padStart(2, '0');
          const ss = String(this.elapsedSec % 60).padStart(2, '0');
          if (this.state === 'listening') return '● 正在听写（' + mm + ':' + ss + '）';
          if (this.state === 'stopping') return '正在结束...';
          if (this.state === 'connecting') return '连接中...';
          if (this.state === 'error') return '重试';
          return '开始听写';
        },
        fullText() {
          return this.finalLines
            .filter(function (l) { return l.type !== 'divider'; })
            .map(function (l) { return l.text; })
            .join('\n');
        }
      },
      mounted() {
        const saved = parseInt(localStorage.getItem('fontSize'), 10);
        if (saved >= 0 && saved <= 9) this.fontSize = saved;
        this._applyTheme(this._resolveTheme());
        this._restoreDraft(); // 恢复上次草稿（沿用旧版「刷新不丢字」体验，PLAN.md §4.6）
        draftTimer = setInterval(() => this._saveDraft(), 30000);
        // click outside 关菜单：点菜单和 ⚙ 本身以外的任何区域都收起（⚙ 由自身 @click 切换，这里跳过）
        if (document.addEventListener) {
          document.addEventListener('click', (e) => {
            if (!this.menuOpen) return;
            const t = e.target;
            if (t && t.closest && t.closest('.menu, [data-menu-toggle]')) return;
            this.menuOpen = false;
          });
        }
        // 跟随系统：未手动设置时，系统切换即时生效
        if (window.matchMedia) {
          try {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
              if (!localStorage.getItem('listen_theme')) this._applyTheme(this._resolveTheme());
            });
          } catch (e) {}
        }
      },
      methods: {
        // ---------- 字号 ----------
        decFont() { if (this.fontSize > 0) this.setFontSize(this.fontSize - 1); },
        incFont() { if (this.fontSize < 9) this.setFontSize(this.fontSize + 1); },
        setFontSize(n) {
          this.fontSize = n;
          localStorage.setItem('fontSize', String(n)); // 沿用旧版键名
        },

        // ---------- 主题（PLAN.md §4.4：系统偏好优先，无偏好按时段兜底，可手动） ----------
        _resolveTheme() {
          const saved = localStorage.getItem('listen_theme');
          if (saved === 'dark' || saved === 'light') return saved;
          if (window.matchMedia) {
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            if (mq.matches) return 'dark';
            if (window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
          }
          const h = new Date().getHours(); // 无偏好：19:00–7:00 深色（沿用旧版规则）
          return h >= 19 || h < 7 ? 'dark' : 'light';
        },
        _applyTheme(theme) {
          this.isDark = theme === 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        },
        toggleTheme() {
          const next = this.isDark ? 'light' : 'dark';
          localStorage.setItem('listen_theme', next);
          this._applyTheme(next);
        },

        // ---------- 菜单动作 ----------
        async copyAll() { this.copyText(this.fullText, '已复制'); },
        async copyText(text, okMsg) {
          if (!text) return;
          this.menuOpen = false;
          try {
            await navigator.clipboard.writeText(text);
            this.toast(okMsg || '已复制');
          } catch (e) {
            // 降级 execCommand（老 WebView）
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e2) {}
            document.body.removeChild(ta);
            this.toast(ok ? '已复制' : '复制失败，请长按文字手动复制');
          }
        },
        clearScreen() {
          if (!window.confirm('确定清空当前屏幕的文字吗？')) return;
          this.finalLines = [];
          this.interimText = '';
          if (committedKeys) committedKeys = new Set();
          this.draftRestored = false;
          localStorage.removeItem('listen_draft');
          this.menuOpen = false;
        },
        logout() {
          localStorage.removeItem('listen_password');
          this.menuOpen = false;
          if (this.state === 'listening') this.stopListening();
          this.gatePassword = '';
          this.gateError = '';
          this.screen = 'gate';
        },
        toast(msg) {
          this.toastMsg = msg;
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { this.toastMsg = ''; }, 1800);
        },

        // ---------- 持久化：草稿与历史（PLAN.md §4.6） ----------
        _restoreDraft() { // 重载时恢复上次屏幕内容（顶部标注「上次内容 · 可清空」）
          try {
            const d = JSON.parse(localStorage.getItem('listen_draft') || 'null');
            if (d && d.text && d.text.trim()) {
              const lines = d.text.split('\n').filter(t => t.trim())
                .map((t, i) => ({ key: 'r' + i, text: t }));
              if (lines.length) {
                this.finalLines = [{ key: 'draft-banner', type: 'divider', label: '上次内容 · 可清空' }].concat(lines);
                this.draftRestored = true;
                this.draftSavedAt = d.savedAt || Date.now();
              }
            }
          } catch (e) {}
        },
        _saveDraft() { // 当前屏幕文本落盘（刷新恢复用）
          const hasContent = this.finalLines.some(l => l.type !== 'divider') || this.interimText;
          if (!hasContent) return;
          const text = this.fullText + (this.interimText ? '\n' + this.interimText : '');
          try {
            localStorage.setItem('listen_draft', JSON.stringify({ text: text, savedAt: Date.now() }));
          } catch (e) {} // 隐私模式等配额异常：丢草稿不崩
        },
        _archiveDraft() { // 恢复过的草稿在开新会话时归档进历史
          const text = this.fullText;
          if (!text) return;
          const list = this._historyLoad();
          list.unshift({ id: 'd-' + Date.now(), startedAt: this.draftSavedAt, endedAt: Date.now(), text: text });
          this._historySave(list);
        },
        _historyLoad() {
          try { return JSON.parse(localStorage.getItem('listen_sessions') || '[]'); } catch (e) { return []; }
        },
        _historySave(list) { // 上限 50 条 / 2MB，超出删最旧
          try {
            while (list.length > 50) list.pop();
            let s = JSON.stringify(list);
            while (s.length > 2 * 1024 * 1024 && list.length > 1) { list.pop(); s = JSON.stringify(list); }
            localStorage.setItem('listen_sessions', s);
          } catch (e) {
            // 仍超配额：砍到 20 条再试
            try {
              localStorage.setItem('listen_sessions', JSON.stringify(list.slice(0, 20)));
            } catch (e2) {}
          }
        },
        _upsertSession() { // 停止/每 60s/pagehide 时落一条
          if (!sessionId) return;
          const text = this.fullText + (this.interimText ? '\n' + this.interimText : '');
          if (!text) return;
          const list = this._historyLoad();
          const entry = { id: sessionId, startedAt: listenStartAt || Date.now(), endedAt: Date.now(), text: text };
          const idx = list.findIndex(s => s.id === sessionId);
          if (idx >= 0) list[idx] = entry; else list.unshift(entry);
          this._historySave(list);
        },

        // ---------- 历史面板 ----------
        openHistory() {
          this.history = this._historyLoad();
          this.menuOpen = false;
          this.screen = 'history';
        },
        openHistoryDetail(id) {
          this.historyDetail = this.history.find(s => s.id === id) || null;
          this.screen = 'historyDetail';
        },
        deleteHistory(id) {
          if (!id || !window.confirm('确定删除这条记录吗？')) return;
          this._historySave(this._historyLoad().filter(s => s.id !== id));
          this.history = this._historyLoad();
          this.historyDetail = null;
          this.screen = 'history';
        },
        clearHistory() {
          if (!window.confirm('确定清空全部历史记录吗？')) return;
          localStorage.removeItem('listen_sessions');
          this.history = [];
        },
        fmtHistoryTime(ts) {
          const d = new Date(ts);
          return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + fmtClock(d);
        },
        fmtHistoryDur(s) {
          if (!s.endedAt || !s.startedAt) return '';
          const min = Math.max(1, Math.round((s.endedAt - s.startedAt) / 60000));
          return min >= 60 ? Math.floor(min / 60) + '小时' + (min % 60) + '分' : min + '分钟';
        },
        historyPreview(s) {
          const first = (s.text || '').split('\n')[0] || '';
          return first.length > 40 ? first.slice(0, 40) + '…' : first;
        },

        // ---------- 滚动（PLAN.md §4.3：自动滚底，上滑暂停，浮标回底） ----------
        onScroll() {
          const el = this.$refs.transcriptEl;
          if (!el) return;
          this.autoScroll = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
        },
        scrollToBottom() {
          this.autoScroll = true;
          this._scrollToBottom();
        },
        async _scrollToBottom() {
          await this.$nextTick();
          const el = this.$refs.transcriptEl;
          if (el && this.autoScroll) el.scrollTop = el.scrollHeight;
        },

        // ---------- 对外动作 ----------
        toggleListen() {
          if (this.state === 'listening') return this.stopListening();
          if (this.state === 'idle' || this.state === 'error') return this.startListening();
        },
        async submitGate() {
          if (this.gateBusy) return;
          if (!this.gatePassword) { this.gateError = '请输入密码'; return; }
          this.gateBusy = true;
          this.gateError = '';
          try {
            const resp = await fetch('/api/auth', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: this.gatePassword })
            });
            if (resp.status === 401) { this.gateError = '密码不对，请重试'; return; }
            if (!resp.ok) { this.gateError = '服务异常，稍后再试'; return; }
            if (this.rememberPassword) localStorage.setItem('listen_password', this.gatePassword);
            this.screen = 'main';
          } catch (e) {
            this.gateError = '网络问题，请检查网络';
          } finally {
            this.gateBusy = false;
          }
        },
        async startListening() {
          try {
            this.state = 'connecting';
            this.errorMsg = '';
            userStopped = false;
            reconnectAttempts = 0;
            if (navigator.vibrate) navigator.vibrate(50);
            this._acquireWakeLock(); // 常亮不 await：拿不到不阻塞收音
            if (!this.__debugNoMic) await this._openMic(); // 真机开麦；调试模式跳过
            const ok = await this._connectSession();
            if (!ok) {
              if (this.screen === 'gate') this.state = 'idle'; // 密码门已弹出，等用户输入
              else if (this.state !== 'error') this._setError(new Error('连不上语音服务，请点重试。'));
              return;
            }
            if (this.draftRestored) { // 上次草稿归档进历史（PLAN.md §4.6）
              this._archiveDraft();
              this.draftRestored = false;
              localStorage.removeItem('listen_draft');
            }
            committedKeys = new Set();
            if (this.finalLines.length) { // 再点开始 = 新会话，旧文保留加分隔（PLAN.md §4.5）
              this.finalLines.push({ key: 'd-' + Date.now(), type: 'divider', label: fmtClock(new Date()) });
            }
            sessionId = 's-' + Date.now();
            this.state = 'listening';
            listenStartAt = Date.now();
            this.elapsedSec = 0;
            if (tickTimer) clearInterval(tickTimer);
            tickTimer = setInterval(() => {
              this.elapsedSec = Math.floor((Date.now() - listenStartAt) / 1000);
            }, 1000);
            if (historyTimer) clearInterval(historyTimer);
            historyTimer = setInterval(() => this._upsertSession(), 60000);
          } catch (e) {
            console.error('[listen] start failed:', e);
            this._setError(this._friendlyError(e));
          }
        },
        stopListening() {
          if (this.state !== 'listening') return;
          this.state = 'stopping';
          userStopped = true;
          if (navigator.vibrate) navigator.vibrate(50);
          // 尾包 flags=0010；无待发数据时附 100ms 静音（PLAN.md §2.5）
          this._sendAudio(SILENCE_100MS, true);
          // 收到 flags 0011 最终响应后服务端会主动 close(1000)；3s 兜底强收
          stopTimer = setTimeout(() => {
            console.warn('[listen] 等待服务端关闭超时，强制结束');
            this._closeWs();
            this._teardownAudio();
            this.state = 'idle';
          }, 3000);
        },

        // ---------- 麦克风与音频管线 ----------
        async _openMic() {
          if (!window.isSecureContext) throw new Error('需要 HTTPS 才能使用麦克风');
          if (micStream) return; // 重连复用（PLAN.md §4.2：麦克风不关）
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('当前浏览器不支持录音');
          }
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') await audioCtx.resume(); // iOS 需用户手势内 resume
          if (!audioCtx.audioWorklet) throw new Error('当前浏览器不支持音频采集（AudioWorklet）');
          const blobUrl = URL.createObjectURL(new Blob([window.LISTEN_WORKLET_SRC], { type: 'application/javascript' }));
          await audioCtx.audioWorklet.addModule(blobUrl);
          URL.revokeObjectURL(blobUrl);
          workletNode = new AudioWorkletNode(audioCtx, 'listen-pcm');
          workletNode.port.onmessage = (e) => this._onAudioChunk(new Uint8Array(e.data.int16));
          srcNode = audioCtx.createMediaStreamSource(micStream);
          srcNode.connect(workletNode); // 不连 destination，避免回环
        },
        _onAudioChunk(bytes) {
          if (this.state !== 'listening' || !ws || ws.readyState !== 1) return; // 重连间隙丢弃
          if (ws.bufferedAmount > 1024 * 1024) { // 1MB：连接劣化，告警丢弃（PLAN.md §4.2）
            console.warn('[listen] 上行拥堵，丢一包 audio（bufferedAmount=' + ws.bufferedAmount + '）');
            return;
          }
          this._sendAudio(bytes, false);
        },
        _sendAudio(bytes, isLast) {
          if (!ws || ws.readyState !== 1) return;
          ws.send(ListenProto.buildAudioFrame(bytes, isLast));
        },
        _teardownAudio() {
          if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
          if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
          if (historyTimer) { clearInterval(historyTimer); historyTimer = null; }
          this._upsertSession(); // 收尾统一落一条历史（正常结束/出错/超时都保留已出文字）
          this._saveDraft();
          this._releaseWakeLock();
          if (srcNode) { try { srcNode.disconnect(); } catch (e) {} srcNode = null; }
          if (workletNode) { try { workletNode.disconnect(); } catch (e) {} workletNode = null; }
          if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
          if (micStream) {
            micStream.getTracks().forEach(function (t) { t.stop(); });
            micStream = null;
          }
        },

        // ---------- 屏幕常亮（PLAN.md §4.4） ----------
        async _acquireWakeLock() {
          try {
            if (navigator.wakeLock && !wakeLock) {
              wakeLock = await navigator.wakeLock.request('screen');
              wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
          } catch (e) { /* 拿不到（不支持/低电量/无手势）不影响主流程 */ }
        },
        _releaseWakeLock() {
          if (wakeLock) {
            try { wakeLock.release(); } catch (e) {}
            wakeLock = null;
          }
        },

        // ---------- 会话连接 ----------
        async _ensureTicket() {
          const saved = localStorage.getItem('listen_password');
          if (!saved) { this.screen = 'gate'; return null; }
          const resp = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: saved })
          });
          if (resp.status === 401) { localStorage.removeItem('listen_password'); this.screen = 'gate'; return null; }
          if (!resp.ok) { this._setError(new Error('服务异常（' + resp.status + '），稍后再试。')); return null; }
          const data = await resp.json();
          return data.ticket;
        },
        _connectSession() {
          const self = this;
          return new Promise(async function (resolve) {
            let settled = false;
            const done = function (ok) { if (!settled) { settled = true; resolve(ok); } };
            let ticket;
            try {
              ticket = await self._ensureTicket();
            } catch (e) {
              self._setError(new Error('网络问题，请检查网络'));
              return done(false);
            }
            if (!ticket) return done(false);
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const sock = new WebSocket(proto + '://' + location.host + '/ws?ticket=' + encodeURIComponent(ticket));
            ws = sock;
            sock.binaryType = 'arraybuffer';
            let opened = false;
            sock.onopen = async function () {
              opened = true;
              sock.send(await ListenProto.buildConfigFrame(CONFIG));
              done(true);
            };
            sock.onmessage = function (e) { self._onServerMessage(e.data); };
            sock.onclose = function (e) { self._onSessionClosed(e, opened); if (!opened) done(false); };
            sock.onerror = function () { if (!opened) done(false); };
            setTimeout(function () {
              if (!opened) { try { sock.close(); } catch (e) {} done(false); }
            }, 8000);
          });
        },
        _onSessionClosed(e, opened) {
          const wasListening = this.state === 'listening';
          this._closeWs();
          if (userStopped || e.code === 1000) { // 正常结束（服务端收尾后主动关）
            this._teardownAudio();
            this.state = 'idle';
            return;
          }
          if (wasListening && this.interimText) { // 异常断开：草稿句服务端不会再补发，落成定稿保留
            this.finalLines.push({ key: 'i-' + Date.now(), text: this.interimText });
            this.interimText = '';
          }
          if (wasListening) { this._scheduleReconnect(e); return; }
          if (this.state === 'connecting') this._setError(new Error('连接断开，请重试。'));
          else this.state = 'idle';
        },
        _closeHint(code) { // 关闭码 → 人话提示（PLAN.md §8）
          if (code === 1008) return '会话时间到了，正在自动重新开始';
          if (code === 1013) return '连接数太多，稍后自动重试';
          if (code === 45000081) return '后台太久断开了，正在重连';
          return null;
        },
        _scheduleReconnect(closeEvent) {
          if (reconnectAttempts >= RECONNECT_DELAYS.length) {
            this._teardownAudio();
            this._setError(new Error('连接断开，请检查网络后点重试；若持续失败请联系管理员。'));
            return;
          }
          const hint = this._closeHint(closeEvent.code);
          if (hint) this.toast(hint);
          const delay = closeEvent.code === 1013 ? Math.max(3000, RECONNECT_DELAYS[reconnectAttempts]) : RECONNECT_DELAYS[reconnectAttempts];
          reconnectAttempts++;
          console.warn('[listen] 非正常断开（code ' + closeEvent.code + '），' + (delay / 1000) + 's 后自动重连');
          this.state = 'connecting';
          const self = this;
          setTimeout(async function () {
            if (userStopped) return;
            const ok = await self._connectSession();
            if (ok) self._onNewSession('重连');
            else if (self.screen === 'gate') { self.state = 'idle'; return; } // 密码被清：回密码门，别再空转
            else self._scheduleReconnect({ code: -1 });
          }, delay);
        },
        _onNewSession(label) { // 重连/恢复成功 = 新会话：重置去重集合、插分隔行、回 listening
          reconnectAttempts = 0;
          committedKeys = new Set(); // 新会话时间戳从头计，旧 key 集合必须换新（否则同 key 定稿行会被误丢）
          if (this.finalLines.length) {
            this.finalLines.push({ key: 'd-' + Date.now(), type: 'divider', label: fmtClock(new Date()) + ' ' + label });
          }
          this.state = 'listening';
        },
        _closeWs() {
          if (ws) {
            ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
            try { ws.close(); } catch (e) {}
            ws = null;
          }
        },

        // ---------- 响应处理 ----------
        async _onServerMessage(data) {
          const f = ListenProto.parseFrame(data);
          if (f.type === 'error') {
            console.warn('[listen] 协议错误帧 code=' + f.code, f.msg);
            if (f.code === 45000081) this.toast(this._closeHint(45000081)); // 等包超时：回前台自动重连兜
            return;
          }
          if (f.type !== 'resp') return;
          let bytes = f.payload;
          if (f.gzip && bytes.length) {
            try { bytes = await ListenProto.gunzip(bytes); } catch (e) { return; }
          }
          let j = null;
          try { j = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { return; }
          console.log('[listen] resp seq=' + f.seq + ' flags=' + f.flags.toString(2).padStart(4, '0'), j);
          if (j && j.result) this._applyResult(j.result);
        },
        _applyResult(result) { // 累积算法 PLAN.md §4.3
          const utts = result.utterances || [];
          let interim = '';
          for (let i = 0; i < utts.length; i++) {
            const u = utts[i];
            if (u.definite) {
              const key = u.start_time + '-' + u.end_time;
              if (committedKeys && !committedKeys.has(key)) {
                committedKeys.add(key);
                this.finalLines.push({ key: key, text: u.text });
              }
            } else {
              interim = u.text; // 最多一个非 definite，取最后一个
            }
          }
          this.interimText = interim;
          this._scrollToBottom();
        },

        // ---------- 错误 ----------
        _friendlyError(e) {
          const name = e && e.name;
          if (name === 'NotAllowedError') return '麦克风权限被拒绝，请在浏览器设置中允许后重试';
          if (name === 'NotFoundError') return '没找到麦克风设备';
          return (e && e.message) || '出错了';
        },
        _setError(msg) {
          this._teardownAudio();
          this._closeWs();
          this.state = 'error';
          this.errorMsg = typeof msg === 'string' ? msg : (msg.message || '出错了');
        },

        // ---------- 调试钩子（obscura/DevTools 用，正常流程不经过） ----------
        __debugStart() { this.__debugNoMic = true; return this.startListening(); },
        __debugFeed(u8) { this._onAudioChunk(u8); },
        __debugFinish() { return this.stopListening(); },
        __debugSimulateDrop() { // 模拟断网：ws 包有 terminate（Node 测试用）；浏览器无则跳过
          if (ws && ws.terminate) ws.terminate();
        }
      }
    });
    const vm = app.mount('#app');
    window.__listen = vm;

    // ---------- 生命周期：pagehide 尽力停止；回前台重拿常亮 + 连接体检 ----------
    if (window.addEventListener) {
      window.addEventListener('pagehide', () => { // 先落草稿/历史，再尽力走停止流程
        if (vm.state === 'listening') {
          vm._saveDraft();
          vm._upsertSession();
          vm.stopListening();
        } else {
          vm._saveDraft();
        }
      });
    }
    if (window.addEventListener && document.addEventListener) {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (vm.state !== 'listening') return;
        vm._acquireWakeLock(); // 常亮锁在后台会被系统回收，回前台重申请
        if (!ws || ws.readyState !== 1) { // 挂起期间连接已死：跳过剩余退避立即重连
          vm._connectSession().then((ok) => { if (ok) vm._onNewSession('恢复'); });
        }
      });
    }
  })();
  </script>
</body>
</html>
